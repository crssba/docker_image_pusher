
name: Sync Docker Images to Aliyun ACR

on:
  workflow_dispatch:
  push:
    branches:
      - new
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: sync-docker-images
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  build:
    name: Pull and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==================================================
      # 1. 检查原始磁盘空间
      # ==================================================
      - name: Check disk before optimization
        run: |
          echo "========== BEFORE =========="
          df -hT
          echo "========== INODES =========="
          df -i
          echo "========== STORAGE =========="
          sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true

      # ==================================================
      # 2. 停止 Docker 和 containerd
      # ==================================================
      - name: Stop Docker services
        run: |
          sudo systemctl stop docker.socket || true
          sudo systemctl stop docker.service || true
          sudo systemctl stop containerd.service || true

      # ==================================================
      # 3. 扩容磁盘
      # ==================================================
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 512
          swap-size-mb: 128

          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

          # 将扩容后的存储空间挂载到 containerd
          build-mount-path: '/var/lib/containerd'

      # ==================================================
      # 4. 启动 Docker
      # ==================================================
      - name: Restart Docker services
        run: |
          sudo systemctl start containerd.service
          sudo systemctl start docker.service

          sleep 5

          docker info

      # ==================================================
      # 5. 检查扩容效果
      # ==================================================
      - name: Check disk after optimization
        run: |
          echo "========== DISK SPACE =========="
          df -hT /
          df -hT /var/lib/containerd
          df -hT /var/lib/docker

          echo "========== INODES =========="
          df -i /var/lib/containerd

          echo "========== DOCKER STORAGE =========="
          docker system df

      # ==================================================
      # 6. 拉取项目
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # 7. 配置 Buildx
      # ==================================================
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==================================================
      # 8. 检查阿里云配置
      # ==================================================
      - name: Validate Aliyun credentials
        run: |
          set -e

          test -n "$ALIYUN_REGISTRY" || {
            echo "ERROR: ALIYUN_REGISTRY is empty"
            exit 1
          }

          test -n "$ALIYUN_NAME_SPACE" || {
            echo "ERROR: ALIYUN_NAME_SPACE is empty"
            exit 1
          }

          test -n "$ALIYUN_REGISTRY_USER" || {
            echo "ERROR: ALIYUN_REGISTRY_USER is empty"
            exit 1
          }

          test -n "$ALIYUN_REGISTRY_PASSWORD" || {
            echo "ERROR: ALIYUN_REGISTRY_PASSWORD is empty"
            exit 1
          }

          test -s images.txt || {
            echo "ERROR: images.txt does not exist or is empty"
            exit 1
          }

          echo "Aliyun configuration OK"

      # ==================================================
      # 9. 登录阿里云 ACR
      # ==================================================
      - name: Login Aliyun ACR
        run: |
          set -e

          echo "$ALIYUN_REGISTRY_PASSWORD" | \
          docker login \
            --username "$ALIYUN_REGISTRY_USER" \
            --password-stdin \
            "$ALIYUN_REGISTRY"

      # ==================================================
      # 10. 分析镜像名称，处理重名
      # ==================================================
      - name: Analyze duplicate images
        id: analyze
        shell: bash
        run: |
          set -euo pipefail

          declare -A duplicate_images=()
          declare -A temp_map=()

          while IFS= read -r line || [[ -n "$line" ]]; do

            line="${line%$'\r'}"

            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            read -r -a args <<< "$line"

            image="${args[${#args[@]}-1]}"
            image="${image%%@*}"

            image_name_tag="${image##*/}"

            if [[ "$image_name_tag" == *:* ]]; then
              image_name="${image_name_tag%%:*}"
            else
              image_name="$image_name_tag"
            fi

            parts="${image//[^\/]}"

            if [[ "$image" == */*/* ]]; then
              name_space=$(echo "$image" | awk -F'/' '{print $2}')
            elif [[ "$image" == */* ]]; then
              name_space="${image%%/*}"
            else
              name_space=""
            fi

            name_space="${name_space}_"

            echo "Image: $image"
            echo "Image name: $image_name"
            echo "Namespace: $name_space"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then

              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                duplicate_images[$image_name]="true"
                echo "Duplicate image detected: $image_name"
              fi

            else
              temp_map[$image_name]="$name_space"
            fi

          done < images.txt

          echo "========== DUPLICATE ANALYSIS COMPLETE =========="

          for name in "${!duplicate_images[@]}"; do
            echo "Duplicate: $name"
          done

      # ==================================================
      # 11. 拉取、标记、推送、清理
      # ==================================================
      - name: Pull tag push and cleanup
        shell: bash
        run: |
          set -Eeuo pipefail

          declare -A duplicate_images=()
          declare -A temp_map=()

          # ----------------------------------------------
          # 重新分析重名镜像
          # ----------------------------------------------

          while IFS= read -r line || [[ -n "$line" ]]; do

            line="${line%$'\r'}"

            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            read -r -a args <<< "$line"

            image="${args[${#args[@]}-1]}"
            image="${image%%@*}"

            image_name_tag="${image##*/}"

            if [[ "$image_name_tag" == *:* ]]; then
              image_name="${image_name_tag%%:*}"
            else
              image_name="$image_name_tag"
            fi

            if [[ "$image" == */*/* ]]; then
              name_space=$(echo "$image" | awk -F'/' '{print $2}')
            elif [[ "$image" == */* ]]; then
              name_space="${image%%/*}"
            else
              name_space=""
            fi

            name_space="${name_space}_"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then

              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                duplicate_images[$image_name]="true"
              fi

            else
              temp_map[$image_name]="$name_space"
            fi

          done < images.txt

          # ----------------------------------------------
          # 正式处理镜像
          # ----------------------------------------------

          while IFS= read -r line || [[ -n "$line" ]]; do

            line="${line%$'\r'}"

            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            read -r -a args <<< "$line"

            image="${args[${#args[@]}-1]}"
            pull_options=("${args[@]:0:${#args[@]}-1}")

            echo ""
            echo "=========================================="
            echo "开始处理镜像: $image"
            echo "=========================================="

            # 获取架构
            platform=""

            for ((i=0; i<${#pull_options[@]}; i++)); do

              if [[ "${pull_options[$i]}" == "--platform" ]]; then
                platform="${pull_options[$((i+1))]}"
                break
              elif [[ "${pull_options[$i]}" == --platform=* ]]; then
                platform="${pull_options[$i]#--platform=}"
                break
              fi

            done

            platform_prefix=""

            if [[ -n "$platform" ]]; then
              platform_prefix="${platform//\//_}_"
            fi

            echo "Platform: ${platform:-default}"
            echo "Platform prefix: $platform_prefix"

            # 拉取镜像
            echo "========== DOCKER PULL =========="

            docker pull "${pull_options[@]}" "$image"

            # 解析镜像名称
            image_name_tag="${image##*/}"
            image_name_tag="${image_name_tag%%@*}"

            if [[ "$image_name_tag" == *:* ]]; then
              image_name="${image_name_tag%%:*}"
            else
              image_name="$image_name_tag"
            fi

            if [[ "$image" == */*/* ]]; then
              name_space=$(echo "$image" | awk -F'/' '{print $2}')
            elif [[ "$image" == */* ]]; then
              name_space="${image%%/*}"
            else
              name_space=""
            fi

            name_space_prefix=""

            # 处理重名镜像
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then

              if [[ -n "$name_space" ]]; then
                name_space_prefix="${name_space}_"
              fi

            fi

            # 生成阿里云镜像名称
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "========== DOCKER TAG =========="
            echo "Source: $image"
            echo "Target: $new_image"

            docker tag "$image" "$new_image"

            # 推送镜像
            echo "========== DOCKER PUSH =========="

            docker push "$new_image"

            echo "========== PUSH SUCCESS =========="
            echo "$new_image"

            # ------------------------------------------
            # 清理当前镜像
            # ------------------------------------------

            echo "========== CLEANUP =========="

            docker rmi "$image" "$new_image" || true

            docker image prune -af || true
            docker builder prune -af || true

            # 显示清理结果
            echo "========== DISK AFTER CLEANUP =========="

            df -hT /var/lib/containerd
            df -hT /var/lib/docker

            docker system df

            echo "========== IMAGE COMPLETE =========="

          done < images.txt

      # ==================================================
      # 12. 最终磁盘检查
      # ==================================================
      - name: Final disk report
        if: always()
        run: |
          echo "========== FINAL DISK =========="

          df -hT || true
          df -i || true

          echo "========== DOCKER STORAGE =========="

          docker system df || true

          echo "========== CONTAINERD STORAGE =========="

          sudo du -sh /var/lib/containerd 2>/dev/null || true

          echo "========== WORKFLOW COMPLETE =========="
